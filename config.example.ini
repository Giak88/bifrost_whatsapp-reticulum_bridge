# Bifrost configuration. setup.sh creates ~/.bifrost/config.ini from this file.
# After editing: sudo systemctl restart bifrost

[bridge]
# LXMF address of whoever may use the bridge (Sideband, MeshChatX...): 32 hex characters.
# It is the client's *delivery* address (the one Sideband shows as "LXMF address"),
# not its identity hash. Several owners separated by commas all get the messages and can all reply.
owner = REPLACE_WITH_YOUR_LXMF_ADDRESS

# Language of the bot replies and of the logs: en | it
language = en

# Name the bridge announces on Reticulum
# name = Bifrost
announce_min = 15

# Biggest file you can send to WhatsApp (files, videos). A stock LXMF router stops at 1 MB.
# Over LoRa 10 MB means hours of airtime: only sensible on fast links (TCP, Tailscale).
max_send_mb = 30

# Data folder (identity, state, spool, WhatsApp session)
dir = ~/.bifrost

# Reticulum config folder: empty = ~/.reticulum, the same one rnsd uses
# rns_config = ~/.reticulum

# Optional: propagation node for deferred delivery if the direct one fails
# propagation_node = <hash>

[limits]
# Above this size (after compression) you get a notice and must send /download N
confirm_threshold_kb = 32
# Above this size a media file cannot be delivered over LXMF at all.
# A stock LXMF router refuses deliveries over 1000 KB: keep this below 1.
max_file_mb = 0.9
# Quality of the media you receive from WhatsApp: low | medium | high | original
# (images: 320 / 640 / 1280 px like Sideband's presets; audio: Codec2 / Opus 12k / Opus 24k)
# You can change them from the chat with /quality; the chat value wins over this one.
quality_img = low
quality_audio = low
# Codec2 mode of the 'low' voice level: 700C 1200 1300 1400 1600 2400 3200 (bps). 2400 = Sideband's default
codec2_mode = 2400
# Real throughput of your LoRa link, only used for the time estimate in notices
link_kbps = 1.2
# Videos you send to WhatsApp as files are delivered as videos up to this size, then as documents
max_video_wa_mb = 16
# Hours after which media you did not download are discarded
pending_ttl_h = 24
# Hours the messages the bridge sends you stay available for /repeat N, and how many at most
history_h = 48
history_max = 100
# WhatsApp groups: none | followed (chosen with /follow N) | all
groups = followed
