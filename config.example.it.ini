# Configurazione di Bifrost. setup.sh crea ~/.bifrost/config.ini a partire da questo file.
# Dopo ogni modifica: sudo systemctl restart bifrost

[bridge]
# Indirizzo LXMF di chi può usare il bridge (Sideband, MeshChatX...): 32 caratteri esadecimali.
# È l'indirizzo di *consegna* del client (quello che Sideband chiama "indirizzo LXMF"),
# non l'hash dell'identità. Più indirizzi separati da virgola: ricevono tutti i messaggi e possono tutti rispondere.
owner = SOSTITUISCI_CON_IL_TUO_INDIRIZZO_LXMF

# Lingua delle risposte del bot e dei log: en | it
language = it

# Nome che il bridge annuncia su Reticulum
# name = Bifrost
announce_min = 15

# Dimensione massima di un invio tuo -> WhatsApp (file, video). Un router LXMF di serie si ferma a 1 MB.
# Su LoRa 10 MB sono ore di trasmissione: sensato solo su link veloci (TCP, Tailscale).
max_send_mb = 30

# Cartella dati (identità, stato, spool, sessione WhatsApp)
dir = ~/.bifrost

# Cartella di configurazione di Reticulum: vuoto = ~/.reticulum, la stessa di rnsd
# rns_config = ~/.reticulum

# Facoltativo: propagation node per la consegna differita se quella diretta fallisce
# propagation_node = <hash>

[limits]
# Sopra questa dimensione (dopo la compressione) arriva un avviso e serve /scarica N
confirm_threshold_kb = 32
# Sopra questa dimensione il media non si può proprio consegnare via LXMF.
# Un router LXMF di serie rifiuta consegne oltre 1000 KB: tieni questo valore sotto 1.
max_file_mb = 0.9
# Qualità dei media che ricevi da WhatsApp: low | medium | high | original
# (in chat anche basso | medio | alto | originale)
# (immagini: 320 / 640 / 1280 px come i preset di Sideband; audio: Codec2 / Opus 12k / Opus 24k)
# Si cambiano anche da chat con /qualita; il valore scelto in chat ha la precedenza su questo.
quality_img = low
quality_audio = low
# Modo Codec2 del livello 'low' dei vocali: 700C 1200 1300 1400 1600 2400 3200 (bps). 2400 = default di Sideband
codec2_mode = 2400
# Throughput reale stimato del tuo link LoRa, usato solo per il tempo stimato negli avvisi
link_kbps = 1.2
# I video che mandi a WhatsApp come file arrivano come video fino a questa dimensione, poi come documento
max_video_wa_mb = 16
# Ore dopo cui i media non scaricati vengono scartati
pending_ttl_h = 24
# Ore per cui i messaggi che il bridge ti invia restano disponibili per /ripeti N, e quanti al massimo
history_h = 48
history_max = 100
# Gruppi WhatsApp: none | followed (scelti con /segui N) | all
groups = followed
